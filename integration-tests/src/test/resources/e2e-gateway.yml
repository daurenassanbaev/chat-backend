spring:
  # The E2E launcher shares message-service's security dependencies.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
      - org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: gateway-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: org.chat.shared.kafka.event
        spring.json.value.default.type: org.chat.shared.kafka.event.MessageDeliveredEvent
        spring.json.use.type.headers: false
  data:
    redis:
      connect-timeout: 1s
      timeout: 2s
